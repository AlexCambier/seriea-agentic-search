# The 17 families of questions. For each one:
#   type       static (2024-25 season), dynamic (2025-26 as it stands) or multihop (two facts in a row)
#   season     the table the answer is read from: past (2024-25), now (2025-26 on the date),
#              or both (a position in 2024-25, then that club today)
#   formula    how the answer is read from the table (see FORMULAS in make_questions.py)
#   answer     what the answer is: a club, a position, a number or a coach
#   picks      the club, position, club and goals, or two clubs of each question
#   phrasings  the ways of asking; the words in {braces} are filled in with the pick

final_position:
  type: static
  season: past
  formula: club_at
  answer: club
  picks: [20, 1, 18, 19, 4, 3, 9]
  phrasings:
  - Which team finished {nth} in Serie A in 2024-25?
  - Who came {nth} in the 2024/25 Serie A?
  - Do you remember which club finished {nth} in the 2024-25 Serie A table?
  - In the 2024/25 Serie A season, which side ended up {nth}?
  - Name the club that finished {nth} in Serie A in 2024-25.

final_place:
  type: static
  season: past
  formula: position
  answer: position
  picks: [Roma, Como, Genoa, Inter, Hellas Verona, Venezia, Juventus]
  phrasings:
  - Where did {team} finish in Serie A in 2024-25?
  - In what position did {team} finish the 2024/25 Serie A season?
  - In 2024-25, where did {team} end up in the Serie A table?
  - Any idea where {team} finished in the 2024/25 Serie A?
  - What was {team}'s final position in the 2024-25 Serie A?

final_points:
  type: static
  season: past
  formula: points
  answer: number
  picks: [Torino, Udinese, Parma, Lazio, Como, Genoa, Monza, Empoli]
  phrasings:
  - How many points did {team} finish the 2024-25 Serie A season with?
  - What was {team}'s final points total in the 2024/25 Serie A?
  - In the 2024-25 Serie A, how many points did {team} end up with?
  - Can you tell me how many league points {team} collected in 2024/25?
  - By the end of the 2024-25 Serie A season, how many points did {team} have?

final_goals:
  type: static
  season: past
  formula: goals
  answer: number
  picks: [[Fiorentina, scored], [Torino, conceded], [Hellas Verona, scored], [Napoli, conceded], [Lecce, scored], [Bologna, conceded], [Milan, scored], [Cagliari, conceded], [Udinese, scored]]
  phrasings:
  - How many league goals did {team} {verb} in 2024-25?
  - In the 2024/25 Serie A season, how many goals did {team} {verb}?
  - Do you know how many goals {team} {verb_past} in Serie A in 2024-25?
  - Over the whole 2024/25 Serie A season, how many goals did {team} {verb}?
  - How many goals had {team} {verb_past} in Serie A by the end of 2024-25?

